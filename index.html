<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Power Meter | BMS 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1e293b; }
    .header { background: linear-gradient(135deg, #1e3a5f, #0f2b45); color: white; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 3px solid #f97316; }
    .header-left h1 { font-size: 1.5rem; }
    .header-left h1 span { color: #f97316; }
    .datetime { font-family: monospace; font-size: 0.8rem; opacity: 0.8; }
    .control-card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 24px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.2); }
    .control-card:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    .status-indicator { width: 12px; height: 12px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
    .status-indicator.off { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; transform: scale(1.2); } }
    .status-text { font-weight: 600; font-size: 0.85rem; }
    .main { padding: 32px; max-width: 1400px; margin: 0 auto; }
    .param-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .param-card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; transition: all 0.3s; }
    .param-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .param-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #64748b; margin-bottom: 8px; }
    .param-value { font-size: 2rem; font-weight: 700; }
    .param-unit { font-size: 0.85rem; font-weight: 500; color: #64748b; margin-left: 4px; }
    .panel { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 24px; }
    .panel-title { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: #64748b; margin-bottom: 16px; display: flex; justify-content: space-between; }
    .chart-container { height: 250px; position: relative; }
    .footer { background: white; padding: 16px 32px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 0.7rem; color: #64748b; }
    .cable-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
    .cable-plugged { background: rgba(16,185,129,0.15); color: #10b981; }
    .cable-unplugged { background: rgba(239,68,68,0.15); color: #ef4444; }
    .status-row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 16px; }
    .status-item { background: #f8fafc; padding: 12px 20px; border-radius: 12px; flex: 1; min-width: 150px; }
    .status-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
    .status-value { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .btn { background: #f0f4f8; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 12px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #e2e8f0; }
    .warning { color: #f97316; }
    .danger { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>Smart <span>Power</span> Meter</h1>
    <p>TEAM BMS 3 | POLIBATAM</p>
  </div>
  <div class="datetime" id="datetime">—</div>
</header>

<main class="main">
  <div class="param-grid">
    <div class="param-card"><div class="param-label">⚡ Tegangan</div><div class="param-value" id="voltage">0.00<span class="param-unit">V</span></div></div>
    <div class="param-card"><div class="param-label">🔁 Arus</div><div class="param-value" id="current">0.00<span class="param-unit">A</span></div></div>
    <div class="param-card"><div class="param-label">💡 Daya</div><div class="param-value" id="power">0.00<span class="param-unit">W</span></div></div>
    <div class="param-card"><div class="param-label">🔋 Energi</div><div class="param-value" id="energy">0.0000<span class="param-unit">kWh</span></div></div>
    <div class="param-card"><div class="param-label">📡 Frekuensi</div><div class="param-value" id="frequency">0.00<span class="param-unit">Hz</span></div></div>
  </div>

  <div class="panel">
    <div class="panel-title">📊 STATUS SISTEM</div>
    <div class="status-row">
      <div class="status-item">
        <div class="status-label">🔌 Status Kabel CAS</div>
        <div class="status-value" id="cableStatus">—</div>
      </div>
      <div class="status-item">
        <div class="status-label">🔌 Status Relay</div>
        <div class="status-value" id="relayStatus">—</div>
      </div>
      <div class="status-item">
        <div class="status-label">⚠️ Mode Overload</div>
        <div class="status-value" id="overloadStatus">—</div>
      </div>
      <div class="status-item">
        <div class="status-label">🎮 Kontrol Web</div>
        <div class="status-value" id="webControl">—</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>📈 GRAFIK DAYA (Watt)</span><span id="chartUpdateTime" style="font-size:0.7rem; font-weight:normal;">—</span></div>
    <div class="chart-container"><canvas id="powerChart"></canvas></div>
  </div>
</main>

<footer class="footer">
  <span>© 2026 Smart Power Meter | BMS 3</span>
  <span id="lastUpdate">Last update: —</span>
</footer>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAP06GuqBy4RIfDa3ngshksvnrfWcn09l8",
    authDomain: "smart-power-meter-f72c9.firebaseapp.com",
    databaseURL: "https://smart-power-meter-f72c9-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "smart-power-meter-f72c9",
    storageBucket: "smart-power-meter-f72c9.appspot.com",
    messagingSenderId: "331580059264",
    appId: "1:331580059264:web:07dcc54bbcbabb22afc065"
  };

  // Initialize Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const database = firebase.database();

  // ============================================================
  // GLOBAL VARIABLES
  // ============================================================
  let powerChart = null;
  let chartData = [];
  let isFirstLoad = true;

  // ============================================================
  // UPDATE DATETIME
  // ============================================================
  function updateDateTime() {
    const now = new Date();
    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    document.getElementById('datetime').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  // ============================================================
  // KIRIM PERINTAH KE ESP32
  // ============================================================
  function sendRelayCommand(turnOn) {
    const controlValue = turnOn ? "ON" : "OFF";
    database.ref('pzem').update({ control: controlValue })
      .then(() => {
        console.log(`✅ Perintah ${controlValue} terkirim ke ESP32`);
        document.getElementById('webControl').innerHTML = turnOn ? '<span class="success">ON (dikirim)</span>' : '<span class="danger">OFF (dikirim)</span>';
        setTimeout(() => {
          document.getElementById('webControl').innerHTML = turnOn ? '<span class="success">ON</span>' : '<span class="danger">OFF</span>';
        }, 2000);
      })
      .catch(err => {
        console.error('❌ Gagal kirim perintah:', err);
        document.getElementById('webControl').innerHTML = '<span class="danger">Gagal kirim!</span>';
      });
  }

  // ============================================================
  // BUAT TOMBOL KONTROL DI HEADER
  // ============================================================
  function createControlButton() {
    const header = document.querySelector('.header');
    const controlCard = document.createElement('div');
    controlCard.className = 'control-card';
    controlCard.innerHTML = '<div class="status-indicator"></div><div class="status-text">SISTEM: ON</div>';
    controlCard.onclick = () => {
      const isCurrentlyOn = controlCard.querySelector('.status-text').textContent === 'SISTEM: ON';
      const newState = !isCurrentlyOn;
      sendRelayCommand(newState);
      
      // Update tampilan tombol sementara
      const indicator = controlCard.querySelector('.status-indicator');
      const text = controlCard.querySelector('.status-text');
      if (newState) {
        indicator.classList.remove('off');
        text.textContent = 'SISTEM: ON';
      } else {
        indicator.classList.add('off');
        text.textContent = 'SISTEM: OFF';
      }
    };
    header.appendChild(controlCard);
    return controlCard;
  }

  // ============================================================
  // UPDATE CHART
  // ============================================================
  function updateChart(power, time) {
    if (!powerChart) {
      const ctx = document.getElementById('powerChart').getContext('2d');
      powerChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Daya (Watt)',
            data: [],
            borderColor: '#f97316',
            backgroundColor: 'rgba(249,115,22,0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top' },
            tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y.toFixed(2)} Watt` } }
          },
          scales: {
            y: { title: { display: true, text: 'Daya (Watt)' } },
            x: { title: { display: true, text: 'Waktu' } }
          }
        }
      });
    }
    
    chartData.push({ time, power });
    if (chartData.length > 20) chartData.shift();
    
    powerChart.data.labels = chartData.map(d => d.time);
    powerChart.data.datasets[0].data = chartData.map(d => d.power);
    powerChart.update();
    
    document.getElementById('chartUpdateTime').textContent = `Update: ${time}`;
  }

  // ============================================================
  // UPDATE UI DARI DATA FIREBASE
  // ============================================================
  function updateUI(data) {
    if (!data) {
      console.log("Menunggu data dari Firebase...");
      return;
    }
    
    console.log("Data diterima:", data);
    
    // Update parameter listrik
    const voltage = data.voltage || 0;
    const current = data.current || 0;
    const power = data.power || 0;
    const energy = data.energy || 0;
    const frequency = data.frequency || 0;
    
    document.getElementById('voltage').innerHTML = voltage.toFixed(2) + '<span class="param-unit">V</span>';
    document.getElementById('current').innerHTML = current.toFixed(2) + '<span class="param-unit">A</span>';
    document.getElementById('power').innerHTML = power.toFixed(2) + '<span class="param-unit">W</span>';
    document.getElementById('energy').innerHTML = energy.toFixed(4) + '<span class="param-unit">kWh</span>';
    document.getElementById('frequency').innerHTML = frequency.toFixed(2) + '<span class="param-unit">Hz</span>';
    
    // Update status kabel
    const cableStatus = document.getElementById('cableStatus');
    if (data.cableStatus === true) {
      cableStatus.innerHTML = '<span class="cable-status cable-plugged">🔌 TERPASANG</span>';
    } else {
      cableStatus.innerHTML = '<span class="cable-status cable-unplugged">❌ DICABUT</span>';
    }
    
    // Update status relay
    const relayStatusEl = document.getElementById('relayStatus');
    const relay = data.relay || 'ON';
    if (relay === 'ON') {
      relayStatusEl.innerHTML = '<span class="success">🟢 ON (Normal)</span>';
    } else if (relay === 'OFF_MANUAL') {
      relayStatusEl.innerHTML = '<span class="danger">🔴 OFF (Perintah Web)</span>';
    } else if (relay === 'OFF_OVERLOAD') {
      relayStatusEl.innerHTML = '<span class="danger">🔴 OFF (Overload)</span>';
    } else {
      relayStatusEl.innerHTML = '<span class="danger">🔴 OFF</span>';
    }
    
    // Update status overload
    const overloadStatus = document.getElementById('overloadStatus');
    if (relay === 'OFF_OVERLOAD') {
      overloadStatus.innerHTML = '<span class="danger">⚠️ AKTIF (Relay MATI)</span>';
    } else {
      overloadStatus.innerHTML = '<span class="success">✅ TIDAK AKTIF</span>';
    }
    
    // Update kontrol web
    const controlVal = data.control || 'ON';
    document.getElementById('webControl').innerHTML = controlVal === 'ON' ? '<span class="success">ON</span>' : '<span class="danger">OFF</span>';
    
    // Update tombol kontrol di header
    const controlCard = document.querySelector('.control-card');
    if (controlCard) {
      const indicator = controlCard.querySelector('.status-indicator');
      const text = controlCard.querySelector('.status-text');
      const isRelayOn = (relay === 'ON');
      if (isRelayOn) {
        indicator.classList.remove('off');
        text.textContent = 'SISTEM: ON';
      } else {
        indicator.classList.add('off');
        text.textContent = 'SISTEM: OFF';
      }
    }
    
    // Update chart
    const now = new Date();
    const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    updateChart(power, timeStr);
    
    // Update last update time
    document.getElementById('lastUpdate').textContent = `Last update: ${now.toLocaleString('id-ID')}`;
    
    // Tampilkan warning jika data 0
    if (power === 0 && voltage === 0 && !isFirstLoad) {
      console.warn("⚠️ Data PZEM = 0! Periksa koneksi PZEM dan pastikan terhubung ke listrik 220V AC");
    }
    isFirstLoad = false;
  }

  // ============================================================
  // SETUP FIREBASE LISTENER
  // ============================================================
  function setupFirebaseListener() {
    const pzemRef = database.ref('pzem');
    
    pzemRef.on('value', (snapshot) => {
      const data = snapshot.val();
      updateUI(data);
    }, (error) => {
      console.error('Firebase error:', error);
      document.getElementById('voltage').innerHTML = 'Error<span class="param-unit">V</span>';
    });
    
    console.log("✅ Firebase listener aktif, menunggu data dari ESP32...");
  }

  // ============================================================
  // START
  // ============================================================
  createControlButton();
  setupFirebaseListener();
  
  console.log("🌐 Web Dashboard siap!");
  console.log("📡 Menghubungkan ke Firebase: " + firebaseConfig.databaseURL);
</script>
</body>
</html>
